<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#01030a;color:white}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}

.header{
position:fixed;top:15px;left:50%;transform:translateX(-50%);
width:94%;max-width:850px;z-index:10;text-align:center;pointer-events:none

.btn{

.btn:hover{background:#087ce0}

.object{

.sun{

.planet{box-shadow:0 0 12px rgba(100,200,255,.5)}

.earth{

radial-gradient(circle at 60% 55%,#32b95c 0 18%,transparent 19%),#167be5
}
.mars{width:22px;height:22px;background:linear-gradient(135deg,#ff875d,#9d291b)}
.jupiter{
width:55px;height:55px;

}
.saturn{width:48px;height:48px;background:linear-gradient(135deg,#ead39a,#aa8249)}
.saturn:after{
content:"";position:absolute;width:80px;height:22px;left:-16px;top:13px;
border:4px solid #d7bd7b;border-radius:50%;transform:rotate(-18deg)
}
.uranus{width:36px;height:36px;background:#73dbe8}
.neptune{width:35px;height:35px;background:#285fe5}

.blackhole{

}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.comet{

.panel{

width:min(92%,520px);max-height:78vh;overflow:auto;padding:25px;

background:rgba(2,8,25,.94);backdrop-filter:blur(18px);
box-shadow:0 0 30px rgba(20,150,255,.35);
z-index:30;display:none;text-align:center

.panel.show{display:block;animation:open .25s ease}
@keyframes open{
from{opacity:0;transform:translate(-50%,-50%) scale(.8)}
to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.panel h2{color:#6bd0ff;font-size:28px;margin-top:0}

font-size:12px;background:rgba(0,10,25,.7);padding:8px 12px;border-radius:10px
}

<div class="controls">
<button class="btn" onclick="randomDiscovery()">🎲 RANDOM</button>

<button class="btn" onclick="zoomOut()">－ ZOOM</button>
<button class="btn" onclick="showObject('Asteroid')">☄️ ASTEROID</button>
<button class="btn" onclick="showObject('Galaxy')">🌌 GALAXY</button>
<button class="btn" onclick="showObject('Nebula')">✨ NEBULA</button>
</div>

<div id="panel" class="panel">
<button class="close" onclick="closePanel()">×</button>
<h2 id="panelTitle"></h2>
<div id="panelText"></div>
<button class="btn" onclick="closePanel()">CONTINUE EXPLORING</button>
</div>

<script>

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
let stars=[],W,H;

function resize(){
W=canvas.width=innerWidth;
H=canvas.height=innerHeight;
stars=[];
for(let i=0;i<260;i++){
stars.push({
x:Math.random()*W,
y:Math.random()*H,
r:Math.random()*1.6+.2,
speed:Math.random()*.45+.05,
a:Math.random()
});
}
}
resize();
addEventListener("resize",resize);

function drawStars(){
ctx.clearRect(0,0,W,H);
for(const s of stars){
s.y+=s.speed;
if(s.y>H){s.y=0;s.x=Math.random()*W}
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fillStyle=`rgba(255,255,255,${s.a})`;
ctx.fill();
}
requestAnimationFrame(drawStars);
}
drawStars();

function showObject(name){

const obj=objects[name];

document.getElementById("panelTitle").textContent=obj.title;

document.getElementById("panelText").innerHTML=
`<p>${obj.text}</p>
${obj.stats.map(x=>`<div class="stat">${x}</div>`).join("")}`;

document.getElementById("panel").classList.add("show");
}

function closePanel(){
document.getElementById("panel").classList.remove("show");
}

function randomDiscovery(){
const list=Object.keys(objects);
showObject(list[Math.floor(Math.random()*list.length)]);
}

function searchObject(){

const value=document.getElementById("search").value.trim().toLowerCase();

const found=Object.keys(objects).find(
x=>x.toLowerCase()===value
);

if(found){
showObject(found);
}else{
document.getElementById("panelTitle").textContent="🔎 NOT FOUND";
document.getElementById("panelText").innerHTML=
"<p>Try: Sun, Earth, Mars, Jupiter, Saturn, Black Hole, Asteroid, Comet, Galaxy or Nebula.</p>";
document.getElementById("panel").classList.add("show");
}
}


let orbitOn=false;
let orbitAngle=0;
let orbitTimer;

function toggleOrbit(){

orbitOn=!orbitOn;

if(orbitOn){

orbitTimer=setInterval(()=>{

orbitAngle+=.02;

const ids=["mercury","venus","earth","mars","jupiter"];

const els=ids.map(id=>document.getElementById(id));
const radii=[7,14,21,28,36];

els.forEach((el,i)=>{

const x=50+Math.cos(orbitAngle*(1+i*.12))*radii[i];
const y=52+Math.sin(orbitAngle*(1+i*.12))*radii[i]*.55;

el.style.left=x+"%";
el.style.top=y+"%";

});

},30);

}else{
clearInterval(orbitTimer);
}
}


let zoom=1;

function zoomIn(){
zoom=Math.min(zoom+.15,2);
document.getElementById("space").style.transform=`scale(${zoom})`;
}

function zoomOut(){
zoom=Math.max(zoom-.15,.7);
document.getElementById("space").style.transform=`scale(${zoom})`;
}


let dragging=false,startX=0,startY=0,moveX=0,moveY=0;

const space=document.getElementById("space");

space.addEventListener("pointerdown",e=>{
dragging=true;
startX=e.clientX-moveX;
startY=e.clientY-moveY;
});

space.addEventListener("pointermove",e=>{

if(!dragging)return;

moveX=e.clientX-startX;
moveY=e.clientY-startY;

space.style.transform=
`translate(${moveX}px,${moveY}px) scale(${zoom})`;
});

space.addEventListener("pointerup",()=>dragging=false);
space.addEventListener("pointercancel",()=>dragging=false);

</script>
